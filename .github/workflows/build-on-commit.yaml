name: Build on Commit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    runs-on: ubuntu-latest

    name: Build and Test (${{ matrix.preset }})
    strategy:
      matrix:
        preset: ["ClangTidy", "SanitizeAsan", "SanitizeTsan"]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential \
            clang lld \
            cmake git \
            libtool autoconf unzip wget \
            libboost-container-dev \
            software-properties-common lsb-release

      - name: Update CMake
        run: |
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /etc/apt/trusted.gpg.d/kitware.gpg >/dev/null
          sudo apt-add-repository "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main"
          sudo apt update -y && \
          sudo apt install -y cmake

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build --preset ${{ matrix.preset }}

      - name: Build project
        run: cmake --build ${{github.workspace}}/build --parallel $(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure
