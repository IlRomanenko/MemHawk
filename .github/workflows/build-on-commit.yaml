name: Build on commit

on:
  workflow_call:
    inputs:
      preset:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    name: Build and Test -- ${{ inputs.preset }}

    env:
      CCACHE_DIR: /tmp/ccache  # Explicit cache location
      CCACHE_COMPRESS: 1       # Enable compression
      CCACHE_COMPRESSLEVEL: 6  # Balance speed/ratio
      CCACHE_MAXSIZE: 2G       # Max cache size
      CCACHE_HARDLINK: 1       # Reduce disk space

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt-get remove -y --purge man-db
          sudo apt install -y \
            build-essential \
            clang lld llvm \
            cmake git \
            ccache \
            libtool autoconf unzip wget \
            libboost-container-dev \
            libprotobuf-dev protobuf-compiler \
            software-properties-common lsb-release

      - name: Ccache persistence
        uses: actions/cache@v3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ inputs.preset }}-ccache-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.preset }}-ccache-

      # not optimal, but greatly reduce amount of files to recompile
      - name: External libs build persistence
        uses: actions/cache@v3
        with:
          path: |
            ${{github.workspace}}/build/external
            ${{github.workspace}}/build/_deps
          key: ${{ runner.os }}-${{ inputs.preset }}-external-${{ hashFiles('**/external/libunwind.cmake', '**/external/xxhash.cmake', '**/external/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.preset }}-external

      - name: Show initial ccache stats
        run: |
          ccache --show-stats
          ccache --zero-stats

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build --preset ${{ inputs.preset }} -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/artifacts -DMEMHAWK_AVX=OFF
      
      - name: Build project
        run: cmake --build ${{github.workspace}}/build --parallel $(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Show final ccache stats
        run: |
          ccache --show-stats
          echo "Cache directory size: $(du -sh $CCACHE_DIR | cut -f1)"

      - name: Install artifacts
        run: cmake --install ${{github.workspace}}/build
  
      - name: Archive build artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ inputs.preset }}
          path: ${{github.workspace}}/artifacts/
